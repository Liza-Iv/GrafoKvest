<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#EFF3F8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no, address=no">
    <meta name="description" content="ГрафоКвест — Настройки">
    <title>ГрафоКвест | Настройки</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="apple-touch-icon" href="/image/decor/icon-192.png">
    <link rel="icon" type="image/png" href="/image/decor/icon-192.png">
    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/settings.css">
</head>

<body class="settings-page">

<!-- PRELOADER -->
<div class="page-loader" id="pageLoader" aria-hidden="true">
    <div class="loader-content">
        <img src="image/decor/logotype.png" alt="" class="loader-logo">
        <div class="loader-spinner"></div>
        <p class="loader-text">Загружаем настройки...</p>
    </div>
</div>

<!-- ШАПКА -->
<header class="page-header" role="banner">
    <div class="header-inner">
        <button class="back-btn" id="backBtn" aria-label="Назад">
            <img src="image/icons/back.png" alt="">
        </button>
        <a href="/menu.html" class="logo-link">
            <img src="image/decor/logotype.png" alt="ГрафоКвест" class="header-logo">
        </a>
        <div class="header-right">
            <select class="child-select" id="childSelect" aria-label="Выбор ребёнка"></select>
        </div>
    </div>
</header>

<!-- ОСНОВНОЙ КОНТЕНТ -->
<main class="settings-container" id="settingsContent">

    <!-- СЕКЦИЯ: ЗВУК -->
    <section class="settings-card">
        <h2 class="card-title">🔇 Звук</h2>
        <div class="setting-row">
            <span class="setting-label">Озвучивание заданий</span>
            <label class="toggle">
                <input type="checkbox" id="voiceEnabled" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="setting-row">
            <span class="setting-label">Звуки интерфейса</span>
            <label class="toggle">
                <input type="checkbox" id="soundEnabled" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="setting-row setting-row-options">
            <span class="setting-label">Скорость речи</span>
            <div class="option-buttons" data-key="speechRate">
                <button class="option-btn" data-value="slow">Медленно</button>
                <button class="option-btn active" data-value="normal">Нормально</button>
                <button class="option-btn" data-value="fast">Быстро</button>
            </div>
        </div>
    </section>

    <!-- СЕКЦИЯ: ВНЕШНИЙ ВИД -->
    <section class="settings-card">
        <h2 class="card-title">🎨 Внешний вид</h2>
        <div class="setting-row setting-row-options">
            <span class="setting-label">Стиль иконок</span>
            <div class="option-buttons" data-key="iconStyle">
                <button class="option-btn active" data-value="regular">Обычные</button>
                <button class="option-btn" data-value="large">Крупные</button>
                <button class="option-btn" data-value="pictogram">Пиктограммы</button>
            </div>
        </div>

        <div class="setting-row setting-row-options">
            <span class="setting-label">Цветовая схема</span>
            <div class="option-buttons" data-key="colorTheme">
                <button class="option-btn active" data-value="standard">Стандарт</button>
                <button class="option-btn" data-value="contrast">Контраст</button>
            </div>
        </div>
        <div class="setting-row">
            <span class="setting-label">Показывать подсказки</span>
            <label class="toggle">
                <input type="checkbox" id="hintsEnabled" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
    </section>

    <!-- СЕКЦИЯ: ТАЙМЕР -->
    <section class="settings-card">
        <h2 class="card-title">⏱️ Таймер</h2>
        <div class="setting-row">
            <span class="setting-label">Включить таймер</span>
            <label class="toggle">
                <input type="checkbox" id="timerEnabled">
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="setting-row setting-row-options">
            <span class="setting-label">Длительность</span>
            <div class="option-buttons" data-key="timerDuration">
                <button class="option-btn active" data-value="5">5 мин</button>
                <button class="option-btn" data-value="7">7 мин</button>
                <button class="option-btn" data-value="10">10 мин</button>
                <button class="option-btn" data-value="15">15 мин</button>
            </div>
        </div>
    </section>

    <!-- КНОПКИ -->
    <div class="settings-actions">
        <button class="settings-btn settings-btn-reset" id="resetBtn" type="button">Сбросить настройки</button>
        <button class="settings-btn settings-btn-save" id="saveBtn" type="button">Сохранить</button>
    </div>

</main>

<div class="toast" id="toast" aria-live="polite"></div>

<script src="js/core/auth.js"></script>
<script src="js/core/timer.js"></script>
<script src="js/page-specific/settings.js"></script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
</script>
</body>
</html>
